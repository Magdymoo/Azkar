<html lang="ar" dir="rtl">

<title>أذكاري أصبح وِردي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#1c2a52;--gold1:#f6d98a;--gold2:#dcab45;--gold3:#b4821f;--goldtx:#b98a22}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;max-width:100%;overflow-x:hidden}
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:var(--navy);
  background:
   radial-gradient(1.5px 1.5px at 12% 8%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 30% 14%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 62% 6%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 85% 18%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 48% 20%,#fff 50%,transparent 51%),
   linear-gradient(180deg,#27386d 0%,#4a5f96 22%,#a9b9dc 48%,#e9eefa 70%,#f6efe6 100%);
  background-attachment:fixed;position:relative}
.moon{position:absolute;top:34px;left:30px;width:78px;height:78px;border-radius:50%;
  box-shadow:-18px 8px 0 0 #fff6dc;filter:drop-shadow(0 0 14px rgba(255,240,200,.7));transform:rotate(-8deg);pointer-events:none}
.leaf{position:absolute;top:0;right:0;width:150px;pointer-events:none}
.cloud{position:absolute;border-radius:50%;background:#fff;filter:blur(18px);opacity:.55;pointer-events:none}
.c1{width:190px;height:90px;top:230px;left:-60px}.c2{width:220px;height:100px;top:300px;right:-80px}
.c3{width:200px;height:90px;top:620px;left:-70px}.c4{width:200px;height:90px;top:760px;right:-70px}
main{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:max(46px,env(safe-area-inset-top)) 18px 190px;text-align:center}
.panel{position:relative;padding-top:104px}
.arch{position:absolute;top:0;left:0;width:100%;height:150px}
.body{position:absolute;top:140px;bottom:-10px;left:6%;right:6%;
  background:linear-gradient(180deg,rgba(255,255,255,.93),rgba(255,255,255,.8) 75%,rgba(255,255,255,0));
  border-radius:0 0 40px 40px;z-index:0}
.in{position:relative;z-index:1;padding:0 8px 18px}
.mega{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:62px;z-index:2}
.title{position:relative;z-index:2;display:flex;align-items:center;gap:12px;justify-content:center;margin-top:20px}
.title h1{font-size:clamp(34px,10vw,44px);font-weight:900;line-height:1.1}
.title i{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--gold2))}
.title i:last-child{background:linear-gradient(270deg,transparent,var(--gold2))}
.lead{margin-top:18px;font-size:clamp(19px,5.6vw,24px);font-weight:500;line-height:1.7}
.lead b{color:var(--goldtx);font-weight:900;font-size:1.3em}
.icons{display:flex;direction:ltr;align-items:flex-start;justify-content:center;gap:10px;margin-top:20px}
.ic{width:min(31vw,132px);aspect-ratio:1;border-radius:24%;object-fit:cover;box-shadow:0 10px 24px rgba(40,50,90,.28);display:block}
.col{display:flex;flex-direction:column;align-items:center}
.arrow{width:58px;margin-top:34px;flex:none}
.ribbon{margin-top:12px;position:relative;font-size:28px;font-weight:900;color:#2a2210;padding:2px 30px 5px;
  background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,#c4952f);clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);
  filter:drop-shadow(0 3px 4px rgba(120,80,10,.3))}
.rb{position:relative;display:inline-block}
.say{margin-top:26px;font-size:clamp(17px,5vw,21px);font-weight:500;line-height:1.85}
.say b{color:var(--goldtx);font-weight:900;font-size:1.15em}
.btn{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto 0;max-width:380px;padding:15px 22px;border-radius:999px;
  text-decoration:none;color:var(--navy);font-weight:900;font-size:clamp(19px,5.4vw,24px);
  background:linear-gradient(180deg,#f8dd91,#e0b04a 52%,#c9972f);
  box-shadow:0 0 0 3px rgba(255,255,255,.7),0 8px 0 #b78523,0 16px 26px rgba(140,95,20,.35);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 3px rgba(255,255,255,.7),0 3px 0 #b78523,0 8px 14px rgba(140,95,20,.3)}
.btn:focus-visible{outline:4px solid #fff;outline-offset:4px}
.btn svg{width:30px;height:30px;flex:none}
.wish{margin-top:30px;display:flex;align-items:center;gap:12px;justify-content:center;color:#5a6488;font-size:15px;font-weight:500}
.wish i{width:60px;height:1px;background:#9aa3c0}
.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:min(30vh,230px);z-index:1;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.sun{animation:glow 5s ease-in-out infinite alternate}@keyframes glow{to{opacity:.75}}}
</style>
</head>

 if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});
}catch(e){}})();
</script>
</body>
</html>
